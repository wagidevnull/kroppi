[package]
name = "kroppi"
version = "0.1.0"
edition = "2024"
description = "Trim and crop videos"
license = "MIT"
authors = ["Wagi <wagi@wagi.lol>"]
repository = "https://github.com/wagidevnull/kroppi"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol: serve the bundled ui/ files, so a plain `cargo build` makes a working app.
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[features]
# Lets a test script drive the app (see tests/). Never enabled in releases.
autotest = []

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
