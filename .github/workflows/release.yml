name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on an older Ubuntu so the binary runs on older distros too.
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav ffmpeg
          rustup update stable && rustup default stable
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build app and packages
        run: npx --yes @tauri-apps/cli@^2 build --ci
        env:
          NO_STRIP: "true"
      - name: Collect files
        run: |
          mkdir dist
          B=src-tauri/target/release
          cp $B/kroppi dist/kroppi-${{ matrix.arch }}
          cp $B/bundle/deb/*.deb $B/bundle/rpm/*.rpm dist/
          cp $B/bundle/appimage/*.AppImage dist/ || echo "no AppImage built"
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: kroppi-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "kroppi $GITHUB_REF_NAME" --generate-notes
